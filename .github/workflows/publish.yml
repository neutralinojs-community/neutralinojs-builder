name: Publish Package to NPM

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: "Version number e.g., 0.1.0"

env:
  VERSION: ${{ inputs.version }}
  VERSION_WITH_V: v${{ inputs.version }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org/'

      - name: Install Dependencies
        run: npm ci

      - name: Create Release Notes
        run: |
          chmod +x ./scripts/rz.py
          ./scripts/rz.py create $VERSION

      - name: Commit and Push Changelog
        uses: EndBug/add-and-commit@v7.4.0
        with:
          default_author: github_actions
          message: 'Update changelog for ${{ env.VERSION_WITH_V }}'
          add: 'CHANGELOG.md'
          tag: ${{ env.VERSION_WITH_V }}

      - name: Bump package.json version
        run: npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to $VERSION" || echo "No changes to commit"
          git push

      - name: Create GitHub Release
        run: |
          gh release create $VERSION_WITH_V \
            --title "neu-builder $VERSION_WITH_V released!" \
            --notes-file ./.tmprz/release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Cleanup
        run: ./scripts/rz.py cleanup